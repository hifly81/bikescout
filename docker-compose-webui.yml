services:
  mcpo:
    container_name: mcpo
    image: ghcr.io/open-webui/mcpo:main
    restart: unless-stopped
    volumes:
      - ./:/app/mcp_servers/bikescout_project
      - ./mcp_config.json:/app/config/config.json
    ports:
      - 8000:8000
    environment:
      - ORS_API_KEY=${ORS_API_KEY}
    entrypoint: >
      sh -c "cd /app/mcp_servers/bikescout_project &&
             rm -rf venv && 
             python3 -m venv venv && 
             ./venv/bin/pip install -e . && 
             cd /app &&
             exec mcpo --config /app/config/config.json --hot-reload"
    networks:
      - bikescout_net

  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: open-webui
    restart: unless-stopped
    ports:
      - 3000:8080
    volumes:
      - open-webui:/app/backend/data
    environment:
      - 'OLLAMA_BASE_URL=http://host.docker.internal:11434'
      - 'WEBUI_SECRET_KEY=aaassasasasasasas11221@@@'
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - bikescout_net

networks:
  bikescout_net:
    driver: bridge

volumes:
  ollama:
  open-webui: