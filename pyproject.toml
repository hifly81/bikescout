[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bikescout"
version = "1.6.0"
authors = [
    { name="Bikescout", email="bikescout.mcp@gmail.com" },
]
description = "Professional product for AI-powered cycling and mountain bike route discovery, terrain analysis, and GPX generation."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "AGPL-3.0-only" }

keywords = [
    "ai",
    "agent",
    "mcp",
    "mcp-server",
    "cycling",
    "bicycle",
    "mountain bike",
    "openstreetmap",
    "route-planning",
    "claude-ai",
    "cline"
]

classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: GNU Affero General Public License v3",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: GIS",
    "Topic :: Communications :: Chat",
]
dependencies = [
    "fastmcp>=3.0.0",
    "requests>=2.31.0",
    "python-dotenv>=1.0.0",
    "polyline>=2.0.0",
    "astral>=3.2",
    "timezonefinder>=6.5.0",
    "pydantic>=2.0.0",
    "matplotlib>=3.8.0",
    "numpy>=1.26.0",
    "gpxpy>=1.6.2",
    "geopy>=2.4.1",
    "staticmap>=0.5.6",
    "pillow>=10.2.0",
    "fpdf>=1.7.2",
    "streamlit>=1.35.0",
    "watchdog>=4.0.0",
    "huggingface_hub>=0.23.0",
    "llama-cpp-python>=0.2.75",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "pytest-asyncio>=0.23.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["src/bikescout/tests"]
asyncio_mode = "auto"

[tool.coverage.run]
source = ["src/bikescout"]
omit = [
    "src/bikescout/tests/*",
    "**/__init__.py",
]

[tool.coverage.report]
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]

[project.urls]
Homepage = "https://hifly81.github.io/bikescout"
Documentation = "https://github.com/hifly81/bikescout#readme"
Repository = "https://github.com/hifly81/bikescout.git"
Issues = "https://github.com/hifly81/bikescout/issues"
Changelog = "https://github.com/hifly81/bikescout/blob/main/CHANGELOG.md"

[project.scripts]
bikescout = "bikescout.mcp_server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/bikescout"]
