[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bikescout"
version = "1.3.1"
authors = [
    { name="Bikescout", email="bikescout.mcp@gmail.com" },
]
description = "Professional MCP server for AI-powered cycling and mountain bike route discovery, terrain analysis, and GPX generation."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "AGPL-3.0-only" }

keywords = [
    "mcp",
    "mcp-server",
    "cycling",
    "bicycle",
    "mountain bike",
    "openstreetmap",
    "route-planning",
    "claude-ai",
    "cline"
]

classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: GIS",
    "Topic :: Communications :: Chat",
]
dependencies = [
    "fastmcp>=3.0.0",
    "requests>=2.31.0",
    "python-dotenv>=1.0.0",
    "polyline>=2.0.0",
    "astral>=3.2",
    "timezonefinder>=6.5.0",
    "pydantic>=2.0.0",
    "matplotlib>=3.8.0",
    "numpy>=1.26.0",
    "gpxpy>=1.6.2",
    "geopy>=2.4.1",
    "staticmap>=0.5.6",
    "pillow>=10.2.0",
    "fpdf>=1.7.2",
]

[project.urls]
Homepage = "https://hifly81.github.io/bikescout"
Documentation = "https://github.com/hifly81/bikescout#readme"
Repository = "https://github.com/hifly81/bikescout.git"
Issues = "https://github.com/hifly81/bikescout/issues"
Changelog = "https://github.com/hifly81/bikescout/blob/main/CHANGELOG.md"

[project.scripts]
bikescout = "bikescout.mcp_server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/bikescout"]
